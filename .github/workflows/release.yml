name: Release

on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: read

jobs:
  # 1. 按平台**原生**编译（与 wist-gateway 同构；不在镜像里编译）。
  build-binaries:
    name: Build ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
          - os: macos-15
            target: aarch64-apple-darwin
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable
          targets: ${{ matrix.target }}

      - name: Cargo build
        run: cargo build --release --locked --target ${{ matrix.target }}

      - name: Package tarball
        run: |
          set -euo pipefail
          mkdir -p artifacts
          cp "target/${{ matrix.target }}/release/wist-field-api" artifacts/wist-field-api
          cp field-api.example.toml artifacts/field-api.example.toml
          tar -czf "wist-field-api-${{ github.ref_name }}-${{ matrix.target }}.tar.gz" \
            -C artifacts wist-field-api field-api.example.toml
          ls -lh "wist-field-api-${{ github.ref_name }}-${{ matrix.target }}.tar.gz"

      - uses: actions/upload-artifact@v7
        with:
          name: wist-field-api-${{ matrix.target }}
          path: wist-field-api-${{ github.ref_name }}-${{ matrix.target }}.tar.gz
          if-no-files-found: error
          retention-days: 7

  # 2a/2b. 原生分架构构建镜像，**不用 QEMU**（同 `wist-center`）：
  #   amd64 → ubuntu-24.04，arm64 → ubuntu-24.04-arm。
  #   之前用 `platforms: linux/amd64,linux/arm64` 一次构建时，arm64 那一段在 amd64 runner
  #   上模拟执行，镜像里的 `apt-get` 要跑 8–10 分钟（实测整个 `Build and push` 33 分钟）。
  #
  #   每个架构对 ghcr / TCR **各推一次**（push-by-digest）：buildx 的 `type=image` 不接受
  #   多个 `name=` + `push-by-digest`（实测只推最后一个），所以不能靠一次构建双推。
  #   manifest 阶段只在各自仓库内建 index —— 不做 ghcr → TCR 的跨仓库搬层。
  docker-amd64:
    name: Docker image (linux/amd64)
    needs: [build-binaries]
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - uses: actions/download-artifact@v8
        with:
          name: wist-field-api-x86_64-unknown-linux-gnu
          path: staged

      - name: Stage binary for docker build
        run: |
          set -euo pipefail
          mkdir -p docker/amd64
          tar -xzf "staged/wist-field-api-${{ github.ref_name }}-x86_64-unknown-linux-gnu.tar.gz" -C docker/amd64
          ls -R docker/amd64

      - uses: docker/setup-buildx-action@v4

      - name: Login to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # 国内镜像源（腾讯云 TCR）：国内服务器拉 ghcr.io 很慢，客户端改用 TCR 地址。
      # 凭据在 TCR 控制台生成（访问凭证，需 push 权限），存 GitHub Secrets：
      # TCR_USERNAME / TCR_PASSWORD。新仓名首次推送时由 TCR 自动建仓。
      - name: Login to TCR
        uses: docker/login-action@v4
        with:
          registry: dy-sec.tencentcloudcr.com
          username: ${{ secrets.TCR_USERNAME }}
          password: ${{ secrets.TCR_PASSWORD }}

      - name: Build and push to ghcr by digest
        id: ghcr
        uses: docker/build-push-action@v7
        with:
          context: docker
          platforms: linux/amd64
          outputs: type=image,name=ghcr.io/${{ github.repository }},push-by-digest=true,push=true
          cache-from: type=gha,scope=field-api-amd64
          cache-to: type=gha,mode=max,scope=field-api-amd64

      - name: Build and push to TCR by digest
        id: tcr
        uses: docker/build-push-action@v7
        with:
          context: docker
          platforms: linux/amd64
          outputs: type=image,name=dy-sec.tencentcloudcr.com/cloud/${{ github.event.repository.name }},push-by-digest=true,push=true
          cache-from: type=gha,scope=field-api-amd64

      - name: Export digests
        run: |
          set -euo pipefail
          mkdir -p /tmp/digests
          ghcr="${{ steps.ghcr.outputs.digest }}"
          tcr="${{ steps.tcr.outputs.digest }}"
          [ -n "${ghcr}" ] && [ -n "${tcr}" ] || { echo "::error::build-push 没有返回 digest"; exit 1; }
          printf '%s' "${ghcr#sha256:}" > /tmp/digests/ghcr-amd64
          printf '%s' "${tcr#sha256:}" > /tmp/digests/tcr-amd64

      - uses: actions/upload-artifact@v7
        with:
          name: digests-amd64
          path: /tmp/digests/*
          if-no-files-found: error
          retention-days: 1

  docker-arm64:
    name: Docker image (linux/arm64)
    needs: [build-binaries]
    runs-on: ubuntu-24.04-arm
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - uses: actions/download-artifact@v8
        with:
          name: wist-field-api-aarch64-unknown-linux-gnu
          path: staged

      - name: Stage binary for docker build
        run: |
          set -euo pipefail
          mkdir -p docker/arm64
          tar -xzf "staged/wist-field-api-${{ github.ref_name }}-aarch64-unknown-linux-gnu.tar.gz" -C docker/arm64
          ls -R docker/arm64

      - uses: docker/setup-buildx-action@v4

      - name: Login to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Login to TCR
        uses: docker/login-action@v4
        with:
          registry: dy-sec.tencentcloudcr.com
          username: ${{ secrets.TCR_USERNAME }}
          password: ${{ secrets.TCR_PASSWORD }}

      - name: Build and push to ghcr by digest
        id: ghcr
        uses: docker/build-push-action@v7
        with:
          context: docker
          platforms: linux/arm64
          outputs: type=image,name=ghcr.io/${{ github.repository }},push-by-digest=true,push=true
          cache-from: type=gha,scope=field-api-arm64
          cache-to: type=gha,mode=max,scope=field-api-arm64

      - name: Build and push to TCR by digest
        id: tcr
        uses: docker/build-push-action@v7
        with:
          context: docker
          platforms: linux/arm64
          outputs: type=image,name=dy-sec.tencentcloudcr.com/cloud/${{ github.event.repository.name }},push-by-digest=true,push=true
          cache-from: type=gha,scope=field-api-arm64

      - name: Export digests
        run: |
          set -euo pipefail
          mkdir -p /tmp/digests
          ghcr="${{ steps.ghcr.outputs.digest }}"
          tcr="${{ steps.tcr.outputs.digest }}"
          [ -n "${ghcr}" ] && [ -n "${tcr}" ] || { echo "::error::build-push 没有返回 digest"; exit 1; }
          printf '%s' "${ghcr#sha256:}" > /tmp/digests/ghcr-arm64
          printf '%s' "${tcr#sha256:}" > /tmp/digests/tcr-arm64

      - uses: actions/upload-artifact@v7
        with:
          name: digests-arm64
          path: /tmp/digests/*
          if-no-files-found: error
          retention-days: 1

  # 2c. 合并两个架构的 digest → 多架构 manifest。
  #     每个仓库用它**自己**的 per-arch digest 作源建 index（只写 manifest，不搬层）。
  docker-manifest:
    name: Compose multi-arch manifest
    needs: [docker-amd64, docker-arm64]
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7

      - uses: actions/download-artifact@v8
        with:
          pattern: digests-*
          path: /tmp/digests
          merge-multiple: true

      - uses: docker/setup-buildx-action@v4

      - name: Login to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Login to TCR
        uses: docker/login-action@v4
        with:
          registry: dy-sec.tencentcloudcr.com
          username: ${{ secrets.TCR_USERNAME }}
          password: ${{ secrets.TCR_PASSWORD }}

      - name: Compute image tags
        id: meta
        run: |
          # 预发布 tag 只推该 tag，**不覆盖 :latest**。两个源同进退。
          ghcr="ghcr.io/${{ github.repository }}"
          tcr="dy-sec.tencentcloudcr.com/cloud/${{ github.event.repository.name }}"
          ghcr_tags="${ghcr}:${{ github.ref_name }}"
          tcr_tags="${tcr}:${{ github.ref_name }}"
          case "${{ github.ref_name }}" in
            *-*)
              ;;
            *)
              ghcr_tags="$(printf '%s\n%s' "$ghcr_tags" "$ghcr:latest")"
              tcr_tags="$(printf '%s\n%s' "$tcr_tags" "$tcr:latest")"
              ;;
          esac
          {
            printf 'ghcr_tags<<__EOF__\n%s\n__EOF__\n' "$ghcr_tags"
            printf 'tcr_tags<<__EOF__\n%s\n__EOF__\n' "$tcr_tags"
          } >> "$GITHUB_OUTPUT"

      # 前置检查：每个仓库的 per-arch digest 必须真在那里。缺一边就快速失败。
      - name: Verify per-arch digests
        run: |
          set -euo pipefail
          ghcr="ghcr.io/${{ github.repository }}"
          tcr="dy-sec.tencentcloudcr.com/cloud/${{ github.event.repository.name }}"
          for f in /tmp/digests/ghcr-*; do
            docker buildx imagetools inspect "${ghcr}@sha256:$(cat "$f")" > /dev/null
          done
          for f in /tmp/digests/tcr-*; do
            docker buildx imagetools inspect "${tcr}@sha256:$(cat "$f")" > /dev/null
          done
          [ "$(find /tmp/digests -name 'ghcr-*' | wc -l | tr -d ' ')" -eq 2 ] || { echo "::error::期望 2 个 ghcr digest"; exit 1; }
          [ "$(find /tmp/digests -name 'tcr-*' | wc -l | tr -d ' ')" -eq 2 ] || { echo "::error::期望 2 个 TCR digest"; exit 1; }

      - name: Create ghcr multi-arch manifest
        env:
          TAGS: ${{ steps.meta.outputs.ghcr_tags }}
        run: |
          set -euo pipefail
          args=()
          while IFS= read -r tag; do
            [ -n "$tag" ] && args+=(-t "$tag")
          done <<< "$TAGS"
          sources=()
          for f in /tmp/digests/ghcr-*; do
            sources+=("ghcr.io/${{ github.repository }}@sha256:$(cat "$f")")
          done
          docker buildx imagetools create "${args[@]}" "${sources[@]}"
          while IFS= read -r tag; do
            [ -n "$tag" ] && docker buildx imagetools inspect "$tag"
          done <<< "$TAGS"

      - name: Create TCR multi-arch manifest
        env:
          TAGS: ${{ steps.meta.outputs.tcr_tags }}
        run: |
          set -euo pipefail
          args=()
          while IFS= read -r tag; do
            [ -n "$tag" ] && args+=(-t "$tag")
          done <<< "$TAGS"
          sources=()
          for f in /tmp/digests/tcr-*; do
            sources+=("dy-sec.tencentcloudcr.com/cloud/${{ github.event.repository.name }}@sha256:$(cat "$f")")
          done
          docker buildx imagetools create "${args[@]}" "${sources[@]}"
          while IFS= read -r tag; do
            [ -n "$tag" ] && docker buildx imagetools inspect "$tag"
          done <<< "$TAGS"

  # 3. tarball 发到 GitHub Release。
  release:
    needs: [build-binaries]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - uses: actions/download-artifact@v8
        with:
          pattern: wist-field-api-*
          path: artifacts
          merge-multiple: true

      - name: Release
        uses: softprops/action-gh-release@v3
        with:
          name: ${{ github.ref_name }}
          tag_name: ${{ github.ref_name }}
          prerelease: ${{ contains(github.ref_name, '-alpha') || contains(github.ref_name, '-beta') }}
          generate_release_notes: true
          files: artifacts/*.tar.gz
