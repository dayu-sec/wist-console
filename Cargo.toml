[package]
name = "wist-console"
version = "0.1.3" #@gxl:set(version)
edition = "2024"
license = "Apache-2.0"
authors = ["wist Dev Team"]
description = "计算区运维台的 BFF：聚合证据 / 资产 / 采集量 / 设备状态，浏览器只跟它说话"
readme = "README.md"

[dependencies]
anyhow = "1"
axum = "0.8"
env_logger = "0.11"
log = "0.4"
# 到证据服务的客户端：只做转发，不缓存正文。
reqwest = { version = "0.13", default-features = false, features = ["json", "rustls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net", "signal", "time"] }
toml = "1.1"
# 配置里的 `${SEC_...}`：与其它服务同口径（env 优先，其次 `.galaxy/sec_value.yml`）。
orion-sec = "0.7"
orion-variate = "0.14"

[dev-dependencies]
http-body-util = "0.1"
tower = { version = "0.5", features = ["util"] }
